# + face boxes (class 0) pseudo-labeled by InsightFace SCRFD-10G. RESEARCH USE ONLY.
# val kept IDENTICAL to face-hand.yaml's val -> fair before/after on the original task.
# (HaGRID-domain performance is measured separately via hagrid-val.yaml.)
path: /home/max/2026/ml-models/datasets
train:
  - face-hand/images/train
  - hagrid_det_v2/images/train
val: face-hand/images/val

names:
  0: face
  1: hand
